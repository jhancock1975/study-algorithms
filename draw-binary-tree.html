<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Binary Tree Renderer</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: linear-gradient(to bottom, #f0f4f8, #d9e2ec);
      color: #333;
    }

    /* Title Styling */
    h2 {
      text-align: center;
      font-family: 'Pacifico', cursive;
      font-size: 2.5em;
      color: #2b6cb0;
      margin-bottom: 10px;
    }

    /* Textarea Styling */
    textarea {
      width: 100%;
      height: 150px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* Controls Styling */
    #controls {
      margin: 10px 0;
      text-align: center;
    }

    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    button:hover {
      background-color: #2c5282;
    }

    /* Tree Container Styling */
    #tree-container {
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 100%;
      height: 600px;
      overflow: auto;
      background: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    svg {
      width: 100%;
      height: 100%;
    }

    /* Node Styling */
    .node circle {
      fill: url(#node-gradient);
      stroke: #2b6cb0;
      stroke-width: 2px;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .node text {
      font-size: 14px;
      font-weight: bold;
      fill: #2b6cb0;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }

    /* Edge Styling */
    .edge {
      stroke: #4a5568;
      stroke-width: 2px;
      stroke-linecap: round;
    }
  </style>
</head>
<body>

  <h2>Binary Tree Renderer</h2>
  <p style="text-align: center;">Paste your JSON description of the tree into the box below and click “Render Tree.”</p>
  <textarea id="json-input">
{
  "tree": {
    "nodes": [
      {"id": "1", "left": "2", "right": "1-2", "value": 1},
      {"id": "2", "left": null, "right": null, "value": 2},
      {"id": "1-2", "left": null, "right": "1-3", "value": 1},
      {"id": "1-3", "left": null, "right": null, "value": 1}
    ],
    "root": "1"
  }
}
  </textarea>
  <div id="controls">
    <button id="render-btn">Render Tree</button>
  </div>
  <div id="tree-container">
    <svg id="tree-svg">
      <!-- Gradient Definition -->
      <defs>
        <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#63b3ed;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>
  </div>

  <script>
    document.getElementById('render-btn').addEventListener('click', () => {
      const input = document.getElementById('json-input').value;
      let data;
      try {
        data = JSON.parse(input);
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
        return;
      }
      if (!data.tree || !data.tree.nodes || !data.tree.root) {
        alert('JSON must have a "tree" object with "nodes" array and "root" id.');
        return;
      }
      renderTree(data.tree);
    });

    function renderTree(tree) {
      const nodesById = {};
      tree.nodes.forEach(n => nodesById[n.id] = { ...n });
      Object.values(nodesById).forEach(n => {
        n.leftNode = n.left ? nodesById[n.left] : null;
        n.rightNode = n.right ? nodesById[n.right] : null;
      });

      const levelHeight = 80;
      const nodeRadius = 14; // Reduced node size by 30%
      let maxX = 0;

      function measure(node) {
        if (!node) return { width: 0, height: 0 };
        const left = measure(node.leftNode);
        const right = measure(node.rightNode);
        node._subtreeWidth = Math.max(left.width + right.width + 40, nodeRadius * 2);
        node._height = Math.max(left.height, right.height) + levelHeight;
        return { width: node._subtreeWidth, height: node._height };
      }

      function layout(node, x, y, level) {
        if (!node) return;
        const left = node.leftNode;
        const right = node.rightNode;
        node.x = x + node._subtreeWidth / 2;
        node.y = y;
        node.level = level; // Track the level for alternating colors
        maxX = Math.max(maxX, node.x);
        if (left) {
          layout(left, x, y + levelHeight, level + 1);
        }
        if (right) {
          const leftWidth = left ? left._subtreeWidth : 0;
          layout(right, x + leftWidth + 40, y + levelHeight, level + 1);
        }
      }

      const root = nodesById[tree.root];
      measure(root);
      layout(root, 0, nodeRadius + 10, 0);

      const svg = document.getElementById('tree-svg');
      svg.innerHTML = '';
      const width = Math.max(maxX + nodeRadius + 20, 300);
      const height = root._height + nodeRadius + 20;
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

      Object.values(nodesById).forEach(n => {
        ['leftNode', 'rightNode'].forEach(dir => {
          const child = n[dir];
          if (child) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', n.x);
            line.setAttribute('y1', n.y + nodeRadius);
            line.setAttribute('x2', child.x);
            line.setAttribute('y2', child.y - nodeRadius);
            line.setAttribute('class', 'edge');
            svg.appendChild(line);
          }
        });
      });

      Object.values(nodesById).forEach(n => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('class', 'node');
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', n.x);
        c.setAttribute('cy', n.y);
        c.setAttribute('r', nodeRadius);
        // Alternate colors based on level
        const fillColor = n.level % 2 === 0 ? '#63b3ed' : '#2b6cb0';
        c.setAttribute('fill', fillColor);
        c.setAttribute('stroke', '#2b6cb0');
        c.setAttribute('stroke-width', '2');
        g.appendChild(c);
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('x', n.x);
        t.setAttribute('y', n.y);
        t.textContent = n.value;
        g.appendChild(t);
        svg.appendChild(g);
      });
    }
  </script>

</body>
</html>
