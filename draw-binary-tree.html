<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Binary Tree Renderer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: linear-gradient(to bottom, #f0f4f8, #d9e2ec);
      color: #333;
    }
    h2 {
      text-align: center;
      font-family: 'Pacifico', cursive;
      font-size: 2.5em;
      color: #2b6cb0;
      margin-bottom: 10px;
    }
    textarea {
      width: 100%;
      height: 150px;
      font-family: monospace;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    #controls {
      margin: 10px 0;
      text-align: center;
    }
    button {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    button:hover {
      background-color: #2c5282;
    }
    #tree-container {
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 100%;
      height: 600px;
      overflow: auto;
      background: white;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    svg {
      width: 100%;
      height: 100%;
    }
    .edge {
      stroke: #4a5568;
      stroke-width: 2px;
      stroke-linecap: round;
    }
    /* Remove this if you don't want the gradient at all */
    .gradient-circle {
      fill: url(#node-gradient);
    }
  </style>
</head>
<body>

  <h2>Binary Tree Renderer</h2>
  <p style="text-align: center;">Paste your JSON description of the tree into the box below and click “Render Tree.”</p>
  <textarea id="json-input">
{
  "tree": {
    "nodes": [
      {"id": "1", "left": "2", "right": "1-2", "value": 1},
      {"id": "2", "left": null, "right": null, "value": 2},
      {"id": "1-2", "left": null, "right": "1-3", "value": 1},
      {"id": "1-3", "left": null, "right": null, "value": 1}
    ],
    "root": "1"
  }
}
  </textarea>
  <div id="controls">
    <button id="render-btn">Render Tree</button>
  </div>
  <div id="tree-container">
    <svg id="tree-svg">
      <defs>
        <linearGradient id="node-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#63b3ed;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1" />
        </linearGradient>
      </defs>
    </svg>
  </div>

  <script>
    document.getElementById('render-btn').addEventListener('click', () => {
      let treeData;
      try {
        treeData = JSON.parse(document.getElementById('json-input').value).tree;
      } catch (e) {
        return alert('Invalid JSON: ' + e.message);
      }
      if (!treeData?.nodes || !treeData.root) {
        return alert('JSON must have a "tree" object with "nodes" array and "root" id.');
      }
      renderTree(treeData);
    });
  
    function renderTree({ nodes, root: rootId }) {
      const lookup = Object.fromEntries(nodes.map(n => [n.id, { ...n }]));
      Object.values(lookup).forEach(n => {
        n.leftNode  = n.left  ? lookup[n.left]  : null;
        n.rightNode = n.right ? lookup[n.right] : null;
      });
  
      const levelHeight = 80;
      const r = 14;
      let maxX = 0;
  
      const measure = node => {
        if (!node) return { width: 0, height: 0 };
        const L = measure(node.leftNode);
        const R = measure(node.rightNode);
        node._w = Math.max(L.width + R.width + 40, r * 2);
        node._h = Math.max(L.height, R.height) + levelHeight;
        return { width: node._w, height: node._h };
      };
  
      const layout = (node, x, y, lvl) => {
        if (!node) return;
        node.x = x + node._w / 2;
        node.y = y;
        node.level = lvl;
        maxX = Math.max(maxX, node.x);
        layout(node.leftNode,  x,                 y + levelHeight, lvl + 1);
        layout(node.rightNode, x + (node.leftNode? node.leftNode._w : 0) + 40, y + levelHeight, lvl + 1);
      };
  
      const root = lookup[rootId];
      measure(root);
      layout(root, 0, r + 10, 0);
  
      const svg = document.getElementById('tree-svg');
      svg.innerHTML = svg.querySelector('defs').outerHTML; // keep defs if you want
      const W = Math.max(maxX + r + 20, 300);
      const H = root._h + r + 20;
      svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  
      // Edges
      Object.values(lookup).forEach(n => {
        [n.leftNode, n.rightNode].forEach(child => {
          if (!child) return;
          const line = document.createElementNS(svg.namespaceURI, 'line');
          line.setAttribute('x1', n.x);
          line.setAttribute('y1', n.y + r);
          line.setAttribute('x2', child.x);
          line.setAttribute('y2', child.y - r);
          line.classList.add('edge');
          svg.appendChild(line);
        });
      });
  
      // Nodes
      Object.values(lookup).forEach(n => {
        const g = document.createElementNS(svg.namespaceURI, 'g');
  
        // Pink on even levels, blue on odd
        const fill = n.level % 2 === 0
          ? '#f687b3'
          : '#2b6cb0';
  
        const c = document.createElementNS(svg.namespaceURI, 'circle');
        c.setAttribute('cx', n.x);
        c.setAttribute('cy', n.y);
        c.setAttribute('r',  r);
        c.setAttribute('fill', fill);
        c.setAttribute('stroke', '#2b6cb0');
        c.setAttribute('stroke-width', 2);
        g.appendChild(c);
  
        const t = document.createElementNS(svg.namespaceURI, 'text');
        t.setAttribute('x', n.x);
        t.setAttribute('y', n.y);
        t.setAttribute('text-anchor', 'middle');
        t.setAttribute('dominant-baseline', 'central');
        t.style.font = 'bold 14px Arial';
        t.style.fill = '#fff';
        t.textContent = n.value;
        g.appendChild(t);
  
        svg.appendChild(g);
      });
    }
  </script>
  

</body>
</html>
